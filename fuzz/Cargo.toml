[package]
name = "andromeda-fuzz"
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
publish = false

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
libfuzzer-sys = "0.4"
andromeda-proto = { path = "../crates/andromeda-proto" }
andromeda-core = { path = "../crates/andromeda-core" }
andromeda-observe = { path = "../crates/andromeda-observe" }
andromeda-quic = { path = "../crates/andromeda-quic" }
andromeda-rpc-protocol = { path = "../crates/andromeda-rpc-protocol" }
andromeda-security-contract = { path = "../crates/andromeda-security-contract" }
