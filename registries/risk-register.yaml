version: 1
source:
  document: docs/Andromeda_SGBDRT_SRPL_Master_Consolidation_2026.pdf
  section: Appendix B - Risk register
  page: 50
risks:
  - id: RISK-001
    title: Scope explosion across V0.5 and V1
    severity: very_high
    likelihood: high
    summary: V0.5 and V1 can lose recoverability focus if advanced analytics, GPU, complex HA/DR, or broad governance work enters the vertical slice before the kernel is recoverable.
    mitigation: "Proposed: Keep a strict recoverable vertical prototype, gate V0.5/V1 scope through explicit decision records, and defer GPU, advanced HA/DR, and complex analytics until recovery invariants are demonstrated."
    owner: risk-decision-manager
    status: open
  - id: RISK-002
    title: Custom QUIC protocol complexity
    severity: high
    likelihood: medium
    summary: A bespoke QUIC protocol can expand the implementation and compatibility surface beyond what V0 can safely absorb.
    mitigation: "Proposed: Keep the V0 envelope small, define explicit stream taxonomy, and benchmark Quinn, s2n-quic, and MsQuic before committing."
    owner: network-protocol-lead
    status: open
  - id: RISK-003
    title: Protobuf schema drift
    severity: high
    likelihood: medium
    summary: Uncontrolled Protobuf evolution can break compatibility between clients, storage, recovery, and network envelopes.
    mitigation: "Proposed: Use stable packages, reserved tags, reserved names, explicit presence, semantic versioning, and compatibility tests."
    owner: protobuf-schema-review
    status: open
  - id: RISK-004
    title: Unsafe Rust defects
    severity: very_high
    likelihood: medium
    summary: Unsafe code in critical paths can compromise memory safety and recoverability if invariants are implicit or untested.
    mitigation: "Proposed: Encapsulate unsafe code, expose safe public APIs, require fuzz and property tests, run Miri or sanitizer campaigns where applicable, and assign code ownership."
    owner: rust-memory-safety-auditor
    status: open
  - id: RISK-005
    title: Recovery orchestration and dependency inversion gaps
    severity: critical
    likelihood: high
    summary: Recovery bugs, inverted dependencies between recovery/storage/transaction components, or allocator reuse before replay safety can silently publish partial state or fail to restore committed state after crashes.
    mitigation: "Proposed: Treat recovery bugs as release-blocking, run crash tests from Phase 1, require recovery orchestration ownership, document dependency direction, and gate allocator reuse on replay-safe invariants and crash-recovery tests."
    owner: storage-recovery-lead
    status: open
  - id: RISK-006
    title: Plan instability
    severity: high
    likelihood: medium
    summary: Plan churn can make execution unpredictable and difficult to explain when catalog or statistics evidence changes.
    mitigation: "Proposed: Use bounded plan classes, hysteresis, plan evidence scores, and controlled invalidation on CatalogVersion or StatsVersion changes."
    owner: optimizer-lead
    status: open
  - id: RISK-007
    title: Map maintenance cost
    severity: high
    likelihood: medium
    summary: Maps can become expensive to refresh or maintain if policies, budgets, and criticality are not explicit.
    mitigation: "Proposed: Require explicit refresh policy, complexity score, maintenance budget, and criticality classification."
    owner: catalog-storage-lead
    status: open
  - id: RISK-008
    title: Statistics overconfidence
    severity: high
    likelihood: medium
    summary: Predictive or statistical evidence can mislead planning if confidence is treated as truth.
    mitigation: "Proposed: Separate confidence, criticality, freshness, realism, and stability scores; never let predictive evidence force a plan alone."
    owner: optimizer-lead
    status: open
  - id: RISK-009
    title: Security surface bypass before transaction creation
    severity: critical
    likelihood: medium
    summary: Blurring Application, Administration, and HA/DR surfaces, especially before transaction creation, can allow powerful commands to bypass IAM, quotas, policy evaluation, or audit.
    mitigation: "Proposed: Keep Application, Administration, and HA/DR surfaces separate with different certificates, endpoints, permissions, quotas, and audits; require pre-transaction authorization and audit decisions before a transaction object or recovery-visible intent is created."
    owner: security-iam-auditor
    status: open
  - id: RISK-010
    title: HADR split-brain and missing fencing
    severity: critical
    likelihood: medium
    summary: HA/DR failover without explicit quorum, lease, and fencing semantics can permit split-brain writers or divergent recovery histories.
    mitigation: "Proposed: Require a HA/DR decision record before implementation, define quorum and fencing invariants, prove single-writer authority during failover, and test partition, clock-skew, and stale-primary scenarios."
    owner: hadr-architect
    status: open
  - id: RISK-011
    title: Schema and catalog lifecycle drift
    severity: high
    likelihood: high
    summary: CatalogVersion, schema evolution, migrations, and generated contract artifacts can drift independently, causing incompatible plans, replay errors, or inconsistent recovery metadata.
    mitigation: "Proposed: Define catalog lifecycle ownership, require compatibility checks for schema and catalog changes, reserve breaking changes behind decision records, and test upgrade, downgrade, replay, and mixed-version catalog access paths."
    owner: catalog-storage-lead
    status: open
  - id: RISK-012
    title: Backup and PITR corruption or incomplete replay
    severity: critical
    likelihood: medium
    summary: Backups, manifests, checkpoints, or PITR logs can be corrupt, incomplete, or inconsistent with WAL/catalog state, producing unrecoverable or silently divergent restores.
    mitigation: "Proposed: Treat restore verification as mandatory, checksum and version backup artifacts, test PITR from base backup through WAL replay, validate catalog compatibility during restore, and keep incomplete replay from publishing recovered state."
    owner: storage-recovery-lead
    status: open
  - id: RISK-013
    title: Audit ledger completeness omission
    severity: critical
    likelihood: medium
    summary: Critical operation emits trace event but does not write to audit ledger, leaving recovery and forensics without complete record. Event classification drift as features are added causes audit records to be incomplete or misclassified.
    mitigation: "Proposed: DEC-032/DEC-033 mandate all nine event families and immutable classification. Contract tests validate family assignment. Dry-run phase validates audit-eligibility before operation commits. audit-trace-specification skill governs future additions to prevent classification drift. Completeness audit tool (future) scans for gaps."
    owner: observability-forensic-architect
    status: open
  - id: RISK-014
    title: Audit ledger corruption or data loss
    severity: critical
    likelihood: medium
    summary: WAL segment containing audit records is corrupted, truncated, or lost due to disk fault or operator error. Recovery cannot establish forensic timeline. Multiple simultaneous segment failures cause unrecoverable gaps.
    mitigation: "Proposed: Audit ledger is part of WAL; subject to WAL durability model (DEC-029). Checksum validation on decode detects corruption. Backup includes audit ledger; restore validates. Crash recovery marks corruption boundary and preserves forensic hold. Multiple-segment loss remains unmitigated; requires distributed backup (future)."
    owner: storage-recovery-lead
    status: open
  - id: RISK-015
    title: Audit query performance regression
    severity: high
    likelihood: high
    summary: Forensic queries over large audit ledger (months/years of operations) become prohibitively slow, making compliance and incident investigation impractical. Query scaling not addressed.
    mitigation: "Proposed: Phase G establishes WAL-based ledger. Future Wave: Audit indexing (LSN-to-family map, principal index) built on-demand or during compaction. Retention policy enforcement prevents unbounded growth. Batch queries with explicit time windows. Query SLA: single-segment <100ms, multi-segment linear in count. Distributed query/sharding for years-scale retention (V2+)."
    owner: query-engine-lead
    status: open
  - id: RISK-016
    title: Audit append blocking critical path
    severity: high
    likelihood: medium
    summary: Despite off-critical-path design intent, audit append becomes synchronous or on the transaction commit path, slowing every commit by audit I/O latency.
    mitigation: "Proposed: gpu-off-commit-path-check skill (audit-trace-specification) verifies decoupling. Async sinks must not block commit. Durable evidence check (LSN >= record_lsn) happens before decision visibility, not before record creation. Performance test validates <5% commit latency degradation. Future changes to synchronous audit must be gated."
    owner: observability-forensic-architect
    status: open
  - id: RISK-017
    title: Audit event classification drift
    severity: high
    likelihood: high
    summary: As features are added, events classified incorrectly or omitted entirely. Informal events bypass audit. Over time, audit ledger degrades in completeness and forensic value.
    mitigation: "Proposed: audit-trace-specification skill governance: all new operational decisions must specify audit family before code change. New families require new decision record. Contract tests validate classification. Audit schema is versioned; evolution gated. Acceptance: PR must cite family assignment and pass contract tests. Informal events must have explicit inclusion/exclusion documentation."
    owner: observability-forensic-architect
    status: open
  - id: RISK-018
    title: Registry permission validation gap
    severity: high
    likelihood: medium
    summary: Registry write operations (catalog mutations, schema updates, procedure registration) may be executed without sufficient permission validation. A caller with low-privilege access could potentially escalate to higher-privilege operations if permission checks are insufficient or bypassed.
    mitigation: "Wave 13 Batch 4 implementation: Centralized PermissionValidator enforces capability-based access control. All registry writes validate principal identity, operation type, resource scope, and capability token before WAL write. Three-tier hierarchy (Application/Administration/Recovery). 20 unit tests validate no escape paths. Permission denials logged to audit ledger. DEC-037."
    owner: security-iam-auditor
    status: mitigated
  - id: RISK-019
    title: Metadata extraction determinism
    severity: medium
    likelihood: low
    summary: SRPL metadata extraction may be non-deterministic across compilation runs, causing same source to yield different metadata and plans, with silent cardinality mismatches. Protobuf descriptor ordering undefined; floating-point rounding non-deterministic; parallel extraction interleaves.
    mitigation: "Wave 13 implementation: Deterministic extraction using sorted tree traversal and stable key ordering. Seeded PRNG from schema hash for cardinality. Pre-emission validation checks against schema contracts. Metadata cache includes determinism fingerprint. 21+ unit tests cover paths; 1000+ fuzz runs all deterministic. DEC-037."
    owner: srpl-compiler-ir-architect
    status: mitigated
  - id: RISK-020
    title: WAL cardinality exhaustion
    severity: medium
    likelihood: low
    summary: WAL segments buffer uncommitted records in memory. During large batch operations, in-memory cardinality may grow unbounded, exhausting heap and triggering OOM. Disk size cap (1MB) insufficient to prevent heap overflow.
    mitigation: "Wave 13 implementation: Hard cardinality bounds (256 rows, 1MB heap) enforced at append time. Segment rotation triggered before overflow. Cardinality check before every append. Backpressure rejects oversized batches. Early rotation at 90% threshold. 11 tests validate bounds; 100M row stress test completes without OOM. DEC-037."
    owner: wal-recovery-specialist
    status: mitigated
