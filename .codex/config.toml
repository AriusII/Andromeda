# Andromeda Codex configuration template.
# Review against your installed Codex version before enabling all features.

approval_policy = "on-request"
sandbox_mode = "workspace-write"
model_reasoning_effort = "high"
model_verbosity = "high"
include_environment_context = true
include_permissions_instructions = true

# Optional: pin a model after checking the model catalog available to your account.
# model = "gpt-5.3-codex"

[features]
hooks = true
codex_hooks = true
child_agents_md = true
plugins = true
multi_agent = true
skills = true

[agents]
max_threads = 60
max_depth = 2
job_max_runtime_seconds = 3600
interrupt_message = true

[tui.model_availability_nux]
"gpt-5.5" = 1

[mcp_servers.rust-lsp-plugin]
command = "rust-lsp-plugin"

[agents.andromeda-architect]
description = "System-level architecture reviewer for Andromeda doctrine, engine boundaries, invariants, and module separation."
config_file = "agents/andromeda-architect.toml"
[agents.srpl-language-specifier]
description = "SRPL language and compiler specialist focused on strict relational procedure semantics."
config_file = "agents/srpl-language-specifier.toml"
