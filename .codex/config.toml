# Andromeda Codex configuration
# Generated package version: 2026.05.07-rust-codex-tooling-v2
model = "gpt-5.5-pro"
model_reasoning_effort = "high"
model_verbosity = "high"
sandbox_mode = "workspace-write"
include_environment_context = true
include_permissions_instructions = true
approval_policy = "on-request"

[features]
hooks = true
codex_hooks = true
child_agents_md = true
plugins = true
multi_agent = true
skills = true

[agents]
max_threads = 60
max_depth = 2
job_max_runtime_seconds = 3600
interrupt_message = true

[tui.model_availability_nux]
"gpt-5.5" = 1

[mcp_servers.rust-lsp-plugin]
command = "rust-lsp-plugin"

# Agent registry
[agents.roadmap-master-orchestrator]
config_file = "agents/roadmap-master-orchestrator.toml"
description = "Central roadmap-following agent for large Andromeda Codex work. Coordinates objectives, task graphs, sub-agent routing, checkpoints, and final integration."

