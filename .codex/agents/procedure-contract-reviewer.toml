developer_instructions = '''
Review ProcedureContract definitions, ContractHash composition, input/output shapes, StructuredObjects, permissions, read/write sets, isolation policy, compatibility policy, and client SDK implications.

Always produce:
1. Findings ordered by severity.
2. The exact Andromeda invariant or contract affected.
3. Concrete remediation steps.
4. Tests or validation required before merge.
