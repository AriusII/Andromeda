name: 07 - Fuzzing

on:
  pull_request:
    branches: [ main ]
  schedule:
    - cron: "23 4 * * 3"
  workflow_dispatch:
    inputs:
      fuzz_seconds:
        description: "Seconds per fuzz target"
        required: false
        default: "15"

permissions:
  contents: read

concurrency:
  group: fuzzing-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fuzz:
    name: Cargo fuzz smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/rust-setup
        with:
          toolchain: nightly
          components: rust-src
      - run: cargo install cargo-fuzz --locked
      - name: Check deterministic corpus seed set
        run: python fuzz/generators/generate_seed_corpus.py --check
      - name: Check fuzz registry
        run: python tools/testing/fuzz_registry_check.py
      - name: Discover fuzz targets
        id: discover
        shell: bash
        run: |
          python tools/testing/fuzz_registry_check.py --list-targets > fuzz-targets.tsv
          cat fuzz-targets.tsv
          echo "count=$(wc -l < fuzz-targets.tsv)" >> "$GITHUB_OUTPUT"
      - name: Run fuzz targets
        if: steps.discover.outputs.count != '0'
        shell: bash
        run: |
          fuzz_seconds="${{ github.event.inputs.fuzz_seconds || '15' }}"
          while IFS=$'\t' read -r target corpus_dir; do
            echo "::group::fuzz $target"
            cargo +nightly fuzz run "$target" "$corpus_dir" -- -max_total_time="$fuzz_seconds"
            echo "::endgroup::"
          done < fuzz-targets.tsv
      - name: No fuzz targets yet
        if: steps.discover.outputs.count == '0'
        run: echo "No fuzz targets found. Add fuzz/fuzz_targets/*.rs to enable fuzzing."
      - name: Rotate stale fuzz artifacts in workspace snapshot
        if: always()
        shell: bash
        run: |
          find fuzz/artifacts -type f -mtime +30 -delete 2>/dev/null || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: fuzz-artifacts
          path: |
            fuzz/artifacts
            fuzz/corpus
            fuzz/corpus/manifest.toml
            fuzz/targets.toml
          if-no-files-found: ignore
          retention-days: 30
