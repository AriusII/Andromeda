name: 07 - Fuzzing

on:
  pull_request:
    branches: [ main ]
  schedule:
    - cron: "23 4 * * 3"
  workflow_dispatch:
    inputs:
      fuzz_seconds:
        description: "Seconds per fuzz target"
        required: false
        default: "15"

permissions:
  contents: read

concurrency:
  group: fuzzing-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fuzz:
    name: Cargo fuzz smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/rust-setup
        with:
          toolchain: nightly
          components: rust-src
      - run: cargo install cargo-fuzz --locked
      - name: Ensure corpus seed set
        run: python fuzz/generators/generate_seed_corpus.py --ensure-only
      - name: Discover fuzz targets
        id: discover
        shell: bash
        run: |
          python - <<'PY' > fuzz-targets.txt
          import pathlib, re
          targets = []
          for line in pathlib.Path("fuzz/targets.toml").read_text(encoding="utf-8").splitlines():
              m = re.match(r'\s*name\s*=\s*"([^"]+)"', line)
              if m:
                  targets.append(m.group(1))
          for target in targets:
              print(target)
          PY
          cat fuzz-targets.txt
          echo "count=$(wc -l < fuzz-targets.txt)" >> "$GITHUB_OUTPUT"
      - name: Run fuzz targets
        if: steps.discover.outputs.count != '0'
        shell: bash
        run: |
          while read -r target; do
            echo "::group::fuzz $target"
            cargo +nightly fuzz run "$target" -- -max_total_time=${{ github.event.inputs.fuzz_seconds || '15' }}
            echo "::endgroup::"
          done < fuzz-targets.txt
      - name: No fuzz targets yet
        if: steps.discover.outputs.count == '0'
        run: echo "No fuzz targets found. Add fuzz/fuzz_targets/*.rs to enable fuzzing."
      - name: Rotate stale fuzz artifacts in workspace snapshot
        if: always()
        shell: bash
        run: |
          find fuzz/artifacts -type f -mtime +30 -delete 2>/dev/null || true
          find fuzz/corpus -type f -mtime +30 -delete 2>/dev/null || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: fuzz-artifacts
          path: |
            fuzz/artifacts
            fuzz/corpus
            fuzz/corpus/manifest.toml
            fuzz/targets.toml
          if-no-files-found: ignore
          retention-days: 30
