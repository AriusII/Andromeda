name: Release Gate Chain

on:
  pull_request:
    branches: [ main ]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "crates/**/Cargo.toml"
      - "deny.toml"
      - "fuzz/**"
      - "tests/**"
      - "tools/testing/supply_chain_preflight.py"
      - "tools/testing/msrv_dependency_check.py"
      - "rust-toolchain.toml"
      - ".github/actions/**"
      - ".github/scripts/**"
      - ".github/workflows/release-gate-chain.yml"
      - ".github/workflows/05-supply-chain.yml"
      - ".github/workflows/06-nightly-deep-validation.yml"
      - "documentations/governance/supply-chain-policy.md"
      - "documentations/testing/**"
  push:
    branches: [ main ]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "crates/**/Cargo.toml"
      - "deny.toml"
      - "fuzz/**"
      - "tests/**"
      - "tools/testing/supply_chain_preflight.py"
      - "tools/testing/msrv_dependency_check.py"
      - "rust-toolchain.toml"
      - ".github/actions/**"
      - ".github/scripts/**"
      - ".github/workflows/release-gate-chain.yml"
      - ".github/workflows/05-supply-chain.yml"
      - ".github/workflows/06-nightly-deep-validation.yml"
      - "documentations/governance/supply-chain-policy.md"
      - "documentations/testing/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-gate-chain-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUST_TOOLCHAIN: "1.95.0"

jobs:
  format:
    name: format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/rust-setup
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt
      - run: cargo fmt --all -- --check

  preflight-check:
    name: preflight-check
    needs: format
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/rust-setup
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Cargo check preflight (not release evidence)
        run: cargo check --workspace --locked

  workspace-check:
    name: workspace-check-release-evidence
    needs: preflight-check
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/rust-setup
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Cargo check release evidence
        run: cargo check --workspace --all-targets --all-features --locked

  supply-chain:
    name: supply-chain-audit-deny
    needs: workspace-check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/rust-setup
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Audit RustSec advisories
        run: |
          cargo install cargo-audit --locked
          cargo audit --deny warnings
      - name: Check deny policy
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features
      - name: Record cargo-vet preview status
        shell: bash
        run: |
          if [[ -f supply-chain/config.toml || -f cargo-vet.toml || -d .cargo-vet ]]; then
            echo "::notice::cargo-vet config detected; promote the accepted vet command into this gate before release sign-off."
          else
            echo "::notice::cargo-vet is preview/planned only; no repository config exists, so this gate does not block on cargo-vet."
          fi

  clippy:
    name: clippy
    needs: supply-chain
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/rust-setup
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - name: Clippy release evidence
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  doc-tests:
    name: doc-tests-release-evidence
    needs: clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/rust-setup
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Documentation tests release evidence
        run: cargo test --doc --workspace --all-features --locked

  nextest-ci:
    name: nextest-ci-release-evidence
    needs: doc-tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/rust-setup
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Install cargo-nextest
        run: cargo install cargo-nextest --locked
      - name: Record cargo-nextest version
        run: cargo nextest --version
      - name: Run nextest CI profile
        run: cargo nextest run --profile ci --workspace --all-features --locked

  unit-tests:
    name: unit-tests
    needs: nextest-ci
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/rust-setup
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - run: cargo test --workspace --lib --locked -- --nocapture

  integration-tests:
    name: integration-tests
    needs: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/rust-setup
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - run: cargo test --workspace --tests --locked -- --nocapture

  fuzz-smoke:
    name: fuzz-smoke-15s
    needs: integration-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/rust-setup
        with:
          toolchain: nightly
          components: rust-src
      - run: cargo install cargo-fuzz --locked
      - name: Check deterministic corpus seed set
        run: python fuzz/generators/generate_seed_corpus.py --check
      - name: Check fuzz registry
        run: python tools/testing/fuzz_registry_check.py
      - name: Discover fuzz targets from canonical registry
        id: discover
        shell: bash
        run: |
          python tools/testing/fuzz_registry_check.py --list-targets > fuzz-targets.tsv
          echo "count=$(wc -l < fuzz-targets.tsv)" >> "$GITHUB_OUTPUT"
      - name: Run fuzz targets
        if: steps.discover.outputs.count != '0'
        shell: bash
        run: |
          set -euo pipefail
          while IFS=$'\t' read -r target corpus_dir; do
            echo "::group::fuzz $target"
            cargo +nightly fuzz run "$target" "$corpus_dir" -- -max_total_time=15
            echo "::endgroup::"
          done < fuzz-targets.tsv
      - name: No fuzz targets yet
        if: steps.discover.outputs.count == '0'
        run: echo "No fuzz targets found. Add fuzz_targets/*.rs to enable fuzzing."

  property-tests:
    name: property-tests-3min
    needs: fuzz-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/rust-setup
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - run: cargo test --workspace --test property_parser_fuzz --locked -- --nocapture
      - run: cargo test -p andromeda-storage --test property_wal_roundtrip --locked -- --nocapture
      - run: cargo test -p andromeda-storage --test property_recovery_replay --locked -- --nocapture
      - run: cargo test -p andromeda-proto --test property_envelope_validation --locked -- --nocapture

  performance-regression:
    name: performance-regression
    needs: property-tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/rust-setup
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - run: python .github/scripts/perf_regression_gate.py --output-dir target/perf-regression
      - uses: actions/upload-artifact@v7
        with:
          name: release-candidate-performance-regression
          path: |
            .github/perf/baseline.release-candidate.json
            .github/perf/thresholds.release-candidate.json
            target/perf-regression/performance-report.json
            target/perf-regression/performance-report.md
          retention-days: 30

  protocol-doctrine-scan:
    name: protocol-doctrine-scan
    needs: performance-regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/rust-setup
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - run: cargo test -p andromeda-quic --test zero_rtt_doctrine_contract --locked
      - name: Run classified Andromeda policy gate
        run: python .github/scripts/andromeda_policy_gate.py --root .

  rto-test:
    name: rto-test
    needs: protocol-doctrine-scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/rust-setup
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - run: cargo test -p andromeda-storage --test property_recovery_replay --locked -- --nocapture
      - run: cargo test -p andromeda-storage --test recovery_completeness_contract --locked -- --nocapture

  backup-restore-forensic:
    name: backup-restore-forensic
    needs: rto-test
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/rust-setup
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Run backup and restore contract evidence
        run: |
          cargo test -p andromeda-storage --test backup_physical_plan_contract --locked -- --nocapture
          cargo test -p andromeda-storage --test backup_execution_plan --locked -- --nocapture
          cargo test -p andromeda-storage --test restore_contract --locked -- --nocapture
      - name: Run ForensicStart evidence
        run: cargo test -p andromeda-storage --locked forensic_start -- --nocapture
      - name: Record full drill status
        run: |
          echo "::notice::Release gate runs existing backup plan, restore contract, and ForensicStart evidence. Full PITR/cluster restore drills remain planned until repository commands exist."
