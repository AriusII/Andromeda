name: Release Gate Chain

on:
  pull_request:
    branches: [ main ]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "crates/**/Cargo.toml"
      - "deny.toml"
      - "fuzz/**"
      - "tests/**"
      - ".github/actions/**"
      - ".github/scripts/**"
      - ".github/workflows/release-gate-chain.yml"
      - ".github/workflows/05-supply-chain.yml"
      - ".github/workflows/06-nightly-deep-validation.yml"
      - "documentations/governance/supply-chain-policy.md"
      - "documentations/testing/**"
  push:
    branches: [ main ]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "crates/**/Cargo.toml"
      - "deny.toml"
      - "fuzz/**"
      - "tests/**"
      - ".github/actions/**"
      - ".github/scripts/**"
      - ".github/workflows/release-gate-chain.yml"
      - ".github/workflows/05-supply-chain.yml"
      - ".github/workflows/06-nightly-deep-validation.yml"
      - "documentations/governance/supply-chain-policy.md"
      - "documentations/testing/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-gate-chain-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  format:
    name: format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/rust-setup
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all -- --check

  compile:
    name: compile
    needs: format
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/rust-setup
        with:
          toolchain: stable
      - run: cargo check --workspace --locked

  supply-chain:
    name: supply-chain-audit-deny
    needs: compile
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/rust-setup
        with:
          toolchain: stable
      - name: Audit RustSec advisories
        run: |
          cargo install cargo-audit --locked
          cargo audit --deny warnings
      - name: Check deny policy
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features
      - name: Record cargo-vet preview status
        shell: bash
        run: |
          if [[ -f supply-chain/config.toml || -f cargo-vet.toml || -d .cargo-vet ]]; then
            echo "::notice::cargo-vet config detected; promote the accepted vet command into this gate before release sign-off."
          else
            echo "::notice::cargo-vet is preview/planned only; no repository config exists, so this gate does not block on cargo-vet."
          fi

  clippy:
    name: clippy
    needs: supply-chain
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/rust-setup
        with:
          toolchain: stable
          components: clippy
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  unit-tests:
    name: unit-tests
    needs: clippy
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/rust-setup
        with:
          toolchain: stable
      - run: cargo test --workspace --lib --locked -- --nocapture

  integration-tests:
    name: integration-tests
    needs: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/rust-setup
        with:
          toolchain: stable
      - run: cargo test --workspace --tests --locked -- --nocapture

  fuzz-smoke:
    name: fuzz-smoke-15s
    needs: integration-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/rust-setup
        with:
          toolchain: nightly
          components: rust-src
      - run: cargo install cargo-fuzz --locked
      - name: Run 15s smoke fuzz over manifest targets
        shell: bash
        run: |
          python fuzz/generators/generate_seed_corpus.py --ensure-only
          python - <<'PY'
          import pathlib, re, subprocess
          names = []
          for line in pathlib.Path("fuzz/targets.toml").read_text(encoding="utf-8").splitlines():
              m = re.match(r'\s*name\s*=\s*"([^"]+)"', line)
              if m:
                  names.append(m.group(1))
          if not names:
              raise SystemExit("no fuzz targets declared")
          for name in names:
              print(f"::group::fuzz {name}")
              subprocess.run(
                  ["cargo", "+nightly", "fuzz", "run", name, "--", "-max_total_time=15"],
                  check=True,
              )
              print("::endgroup::")
          PY

  property-tests:
    name: property-tests-3min
    needs: fuzz-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/rust-setup
        with:
          toolchain: stable
      - run: cargo test --workspace --test property_parser_fuzz --locked -- --nocapture
      - run: cargo test -p andromeda-storage --test property_wal_roundtrip --locked -- --nocapture
      - run: cargo test -p andromeda-storage --test property_recovery_replay --locked -- --nocapture
      - run: cargo test -p andromeda-proto --test property_envelope_validation --locked -- --nocapture

  performance-regression:
    name: performance-regression
    needs: property-tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/rust-setup
        with:
          toolchain: stable
      - run: python .github/scripts/perf_regression_gate.py --output-dir target/perf-regression
      - uses: actions/upload-artifact@v7
        with:
          name: release-candidate-performance-regression
          path: |
            .github/perf/baseline.release-candidate.json
            .github/perf/thresholds.release-candidate.json
            target/perf-regression/performance-report.json
            target/perf-regression/performance-report.md
          retention-days: 30

  protocol-doctrine-scan:
    name: protocol-doctrine-scan
    needs: performance-regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/rust-setup
        with:
          toolchain: stable
      - run: cargo test -p andromeda-quic --test zero_rtt_doctrine_contract --locked
      - name: Run classified Andromeda policy gate
        run: python .github/scripts/andromeda_policy_gate.py --root .

  rto-test:
    name: rto-test
    needs: protocol-doctrine-scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/rust-setup
        with:
          toolchain: stable
      - run: cargo test -p andromeda-storage --test property_recovery_replay --locked -- --nocapture
      - run: cargo test -p andromeda-storage --test recovery_completeness_contract --locked -- --nocapture

  backup-restore-forensic:
    name: backup-restore-forensic
    needs: rto-test
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/rust-setup
        with:
          toolchain: stable
      - name: Run backup and restore contract evidence
        run: |
          cargo test -p andromeda-storage --test backup_physical_plan_contract --locked -- --nocapture
          cargo test -p andromeda-storage --test backup_execution_plan --locked -- --nocapture
          cargo test -p andromeda-storage --test restore_contract --locked -- --nocapture
      - name: Run ForensicStart evidence
        run: cargo test -p andromeda-storage --locked forensic_start -- --nocapture
      - name: Record full drill status
        run: |
          echo "::notice::Release gate runs existing backup plan, restore contract, and ForensicStart evidence. Full PITR/cluster restore drills remain planned until repository commands exist."
