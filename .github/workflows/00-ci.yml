name: 00 - CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUSTFLAGS: "-Dwarnings"

jobs:
  cargo-fast-gate:
    name: Cargo fast quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust-setup
        with:
          toolchain: stable
          components: rustfmt,clippy
      - name: Validate lockfile
        run: cargo metadata --locked --format-version 1 > /tmp/cargo-metadata.json
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy strict
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Build workspace
        run: cargo build --workspace --all-features --locked
      - name: Test workspace
        run: cargo test --workspace --all-features --locked
      - name: Doc tests
        run: cargo test --workspace --doc --all-features --locked
      - name: Build documentation with warnings denied
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --workspace --all-features --no-deps --locked

  policy-gate:
    name: Andromeda project policy gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Validate Andromeda forbidden patterns
        run: python .github/scripts/andromeda_policy_gate.py
      - name: Validate YAML
        run: python .github/scripts/yaml_sanity.py
