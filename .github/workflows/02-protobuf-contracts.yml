name: 02 - Protobuf Contract Governance

on:
  pull_request:
    branches: [ main ]
    paths: [ "schemas/proto/**/*.proto", "proto/**/*.proto", ".github/workflows/02-protobuf-contracts.yml", ".github/actions/protobuf-governance/**" ]
  push:
    branches: [ main ]
    paths: [ "schemas/proto/**/*.proto", "proto/**/*.proto", ".github/workflows/02-protobuf-contracts.yml", ".github/actions/protobuf-governance/**" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: protobuf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  protobuf-policy:
    name: Protobuf without gRPC policy gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/protobuf-governance
      - name: Generate contract manifest
        run: python .github/scripts/proto_manifest.py
      - uses: actions/upload-artifact@v4
        with:
          name: protobuf-contract-manifest
          path: target/protobuf-contract-manifest.json
          retention-days: 14
