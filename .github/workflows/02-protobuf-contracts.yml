name: 02 - Protobuf Contract Governance

on:
  pull_request:
    branches: [ main ]
    paths:
      - ".codex/schemas/proto/**/*.proto"
      - "proto/**/*.proto"
      - "crates/andromeda-proto/proto/**/*.proto"
      - "crates/andromeda-proto/Cargo.toml"
      - "crates/andromeda-proto/build.rs"
      - ".github/workflows/02-protobuf-contracts.yml"
      - ".github/actions/protobuf-governance/**"
      - ".github/scripts/proto_manifest.py"
      - ".github/scripts/protocol_doctrine_scan.py"
  push:
    branches: [ main ]
    paths:
      - ".codex/schemas/proto/**/*.proto"
      - "proto/**/*.proto"
      - "crates/andromeda-proto/proto/**/*.proto"
      - "crates/andromeda-proto/Cargo.toml"
      - "crates/andromeda-proto/build.rs"
      - ".github/workflows/02-protobuf-contracts.yml"
      - ".github/actions/protobuf-governance/**"
      - ".github/scripts/proto_manifest.py"
      - ".github/scripts/protocol_doctrine_scan.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: protobuf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  protobuf-policy:
    name: Protobuf without gRPC policy gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/protobuf-governance
      - name: Generate contract manifest
        run: python .github/scripts/proto_manifest.py
      - uses: actions/upload-artifact@v7
        with:
          name: protobuf-contract-manifest
          path: target/protobuf-contract-manifest.json
          retention-days: 14
