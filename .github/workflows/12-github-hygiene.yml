name: 12 - GitHub Hygiene

on:
  pull_request:
    branches: [ main ]
    paths: [ ".github/**" ]
  push:
    branches: [ main ]
    paths: [ ".github/**" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-hygiene-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: raven-actions/actionlint@v2

  yaml-sanity:
    name: YAML sanity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - run: python .github/scripts/yaml_sanity.py
