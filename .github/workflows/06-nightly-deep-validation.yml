name: 06 - Nightly Deep Validation

on:
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-deep-validation
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: full

jobs:
  miri:
    name: Miri UB smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/rust-setup
        with:
          toolchain: nightly
          components: miri
      - name: Prepare advisory evidence directory
        run: mkdir -p target/deep-validation/miri
      - name: Record targeted Miri subset inventory
        shell: bash
        run: |
          if [[ -f tools/testing/miri_subset.py ]]; then
            python tools/testing/miri_subset.py --show-exclusions | tee target/deep-validation/miri/subset-inventory.log
          else
            echo "No tools/testing/miri_subset.py script is present; targeted Miri subset commands were not discovered." | tee target/deep-validation/miri/subset-inventory.log
          fi
      - name: Set up Miri
        shell: bash
        run: |
          set -o pipefail
          cargo +nightly miri setup 2>&1 | tee target/deep-validation/miri/setup.log
      - name: Run workspace Miri smoke preflight
        shell: bash
        run: |
          set -o pipefail
          cargo +nightly miri test --workspace --all-features 2>&1 | tee target/deep-validation/miri/workspace-smoke.log
      - name: Write Miri non-release evidence note
        if: always()
        shell: bash
        run: |
          mkdir -p target/deep-validation/miri
          {
            echo "# Miri Advisory Evidence"
            echo
            echo "- Workflow: 06 - Nightly Deep Validation"
            echo "- Job: miri"
            echo "- Exact setup command: cargo +nightly miri setup"
            echo "- Exact preflight command: cargo +nightly miri test --workspace --all-features"
            echo "- Targeted subset inventory: see subset-inventory.log; inventory output is not an executed release gate."
            echo "- Job status at artifact time: ${{ job.status }}"
            echo "- Release effect: advisory only; this continue-on-error job is not release evidence and does not claim a pass."
            echo "- Required release evidence: retain a blocking or release-reviewed owner-crate Miri run for the affected unsafe or aliasing-sensitive surface."
          } > target/deep-validation/miri/NON_RELEASE_EVIDENCE.md
      - name: Upload Miri advisory artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-miri-advisory-non-release
          path: target/deep-validation/miri
          retention-days: 14

  loom:
    name: Loom standalone smoke model
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/rust-setup
        with:
          toolchain: stable
      - name: Prepare advisory evidence directory
        run: mkdir -p target/deep-validation/loom
      - name: Run standalone Loom smoke model
        shell: bash
        run: |
          if [[ ! -f tests/loom/Cargo.toml ]]; then
            echo "Blocked: tests/loom/Cargo.toml is not present; no standalone Loom smoke command executed." | tee target/deep-validation/loom/standalone-smoke.log
            exit 0
          fi
          set -o pipefail
          cargo test --manifest-path tests/loom/Cargo.toml 2>&1 | tee target/deep-validation/loom/standalone-smoke.log
      - name: Write Loom non-release evidence note
        if: always()
        shell: bash
        run: |
          mkdir -p target/deep-validation/loom
          {
            echo "# Loom Advisory Evidence"
            echo
            echo "- Workflow: 06 - Nightly Deep Validation"
            echo "- Job: loom"
            echo "- Exact smoke command: cargo test --manifest-path tests/loom/Cargo.toml"
            echo "- Exact owner-crate release command shape: cargo test -p <owning-crate> --features loom <target-name> --locked -- --nocapture"
            echo "- Job status at artifact time: ${{ job.status }}"
            echo "- Release effect: advisory only; this continue-on-error job is not owner-crate release evidence and does not claim release readiness."
            echo "- Required release evidence: retain the owner-crate Loom model for the affected production concurrency surface, with modeled state, bounds, assertions, and residual risk."
          } > target/deep-validation/loom/NON_RELEASE_EVIDENCE.md
      - name: Upload Loom advisory artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-loom-advisory-non-release
          path: target/deep-validation/loom
          retention-days: 14

  sanitizers:
    name: Address sanitizer smoke
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/rust-setup
        with:
          toolchain: nightly
          components: rust-src
      - name: Run ASAN tests
        env:
          RUSTFLAGS: "-Zsanitizer=address"
          RUSTDOCFLAGS: "-Zsanitizer=address"
        run: cargo +nightly test --workspace --all-features -Z build-std

  unused-deps:
    name: cargo-udeps
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/rust-setup
        with:
          toolchain: nightly
      - run: cargo install cargo-udeps --locked
      - run: cargo +nightly udeps --workspace --all-targets
