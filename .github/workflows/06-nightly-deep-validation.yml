name: 06 - Nightly Deep Validation

on:
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-deep-validation
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: full

jobs:
  miri:
    name: Miri UB smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/rust-setup
        with:
          toolchain: nightly
          components: miri
      - run: cargo +nightly miri setup
      - run: cargo +nightly miri test --workspace --all-features

  sanitizers:
    name: Address sanitizer smoke
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/rust-setup
        with:
          toolchain: nightly
          components: rust-src
      - name: Run ASAN tests
        env:
          RUSTFLAGS: "-Zsanitizer=address"
          RUSTDOCFLAGS: "-Zsanitizer=address"
        run: cargo +nightly test --workspace --all-features -Z build-std

  unused-deps:
    name: cargo-udeps
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/rust-setup
        with:
          toolchain: nightly
      - run: cargo install cargo-udeps --locked
      - run: cargo +nightly udeps --workspace --all-targets
