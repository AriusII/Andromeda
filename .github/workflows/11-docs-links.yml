name: 11 - Documentation and Links

on:
  pull_request:
    branches: [ main ]
    paths: [ "**/*.md", ".github/workflows/11-docs-links.yml" ]
  push:
    branches: [ main ]
    paths: [ "**/*.md", ".github/workflows/11-docs-links.yml" ]
  schedule:
    - cron: "29 5 * * 4"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-links-${{ github.ref }}
  cancel-in-progress: true

jobs:
  markdown:
    name: Markdown lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: DavidAnson/markdownlint-cli2-action@v23
        with:
          globs: "**/*.md"

  links:
    name: Link check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --verbose --no-progress "**/*.md"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
