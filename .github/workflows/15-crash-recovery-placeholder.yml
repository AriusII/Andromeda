name: 15 - RTO Test

on:
  pull_request:
    branches: [ main ]
    paths: [ "crates/**", "tests/**", ".github/workflows/15-crash-recovery-placeholder.yml" ]
  push:
    branches: [ main ]
    paths: [ "crates/**", "tests/**", ".github/workflows/15-crash-recovery-placeholder.yml" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crash-recovery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rto-test:
    name: Recovery RTO and replay gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust-setup
        with:
          toolchain: stable
      - name: Run deterministic recovery replay contracts
        shell: bash
        run: |
          cargo test -p andromeda-storage --test property_recovery_replay --locked -- --nocapture
          cargo test -p andromeda-storage --test recovery_completeness_contract --locked -- --nocapture
