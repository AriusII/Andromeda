name: Perf Regression

on:
  pull_request:
    branches: [ main ]
    paths:
      - "crates/**/*.rs"
      - ".github/perf/**"
      - ".github/scripts/perf_regression_gate.py"
      - ".github/workflows/perf-regression.yml"
  push:
    branches: [ main ]
    paths:
      - "crates/**/*.rs"
      - ".github/perf/**"
      - ".github/scripts/perf_regression_gate.py"
      - ".github/workflows/perf-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: perf-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  performance-regression:
    name: performance-regression
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/rust-setup
        with:
          toolchain: stable
      - run: cargo test -p andromeda-bench --locked --quiet
      - name: Compare against release-candidate baseline
        run: python .github/scripts/perf_regression_gate.py --output-dir target/perf-regression
      - uses: actions/upload-artifact@v7
        with:
          name: perf-regression-release-candidate
          path: |
            .github/perf/baseline.release-candidate.json
            .github/perf/thresholds.release-candidate.json
            target/perf-regression/performance-report.json
            target/perf-regression/performance-report.md
          retention-days: 30
