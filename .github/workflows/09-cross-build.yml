name: 09 - Cross Build x64 and ARM64

on:
  pull_request:
    branches: [ main ]
    paths: [ "**/*.rs", "Cargo.toml", "Cargo.lock", ".github/workflows/09-cross-build.yml" ]
  push:
    branches: [ main ]
    paths: [ "**/*.rs", "Cargo.toml", "Cargo.lock", ".github/workflows/09-cross-build.yml" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cross-build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  linux-targets:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            packages: ""
          - target: aarch64-unknown-linux-gnu
            packages: "gcc-aarch64-linux-gnu"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust-setup
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: Install cross linker
        if: matrix.packages != ''
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.packages }}
      - name: Configure ARM64 linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          mkdir -p .cargo
          cat >> .cargo/config.toml <<'EOF'
          [target.aarch64-unknown-linux-gnu]
          linker = "aarch64-linux-gnu-gcc"
          EOF
      - run: cargo build --workspace --all-features --locked --target ${{ matrix.target }}
