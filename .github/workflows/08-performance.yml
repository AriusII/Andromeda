name: 08 - Performance Regression

on:
  pull_request:
    branches: [ main ]
    paths: [ "**/*.rs", "benches/**", "Cargo.toml", "Cargo.lock", ".github/workflows/08-performance.yml" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: performance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  criterion:
    name: Criterion benchmark smoke
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust-setup
        with:
          toolchain: stable
      - name: Run benchmarks if present
        run: |
          if find . -path "*/benches/*.rs" | grep -q .; then
            cargo bench --workspace --all-features --locked -- --nocapture
          else
            echo "No Rust benchmark targets found."
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: criterion-output
          path: target/criterion
          if-no-files-found: ignore
          retention-days: 30
