name: 16 - Protocol Doctrine Scan

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  protocol-doctrine-scan:
    name: protocol-doctrine-scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Run protocol doctrine scan tests
        run: python -m unittest discover -s .github/scripts/tests -p "test_protocol_doctrine_scan.py"
      - name: Validate protocol doctrine
        run: python .github/scripts/protocol_doctrine_scan.py --output target/protocol-doctrine-scan/report.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: protocol-doctrine-scan
          path: target/protocol-doctrine-scan/report.json
          retention-days: 14
