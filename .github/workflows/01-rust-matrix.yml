name: 01 - Rust Matrix

on:
  pull_request:
    branches: [ main ]
    paths: [ "**/*.rs", "Cargo.toml", "Cargo.lock", ".github/workflows/01-rust-matrix.yml" ]
  push:
    branches: [ main ]
    paths: [ "**/*.rs", "Cargo.toml", "Cargo.lock", ".github/workflows/01-rust-matrix.yml" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-matrix-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  matrix:
    name: ${{ matrix.os }} / ${{ matrix.toolchain }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest ]
        toolchain: [ stable, beta ]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust-setup
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt,clippy
      - run: cargo check --workspace --all-targets --all-features --locked
      - run: cargo test --workspace --all-features --locked

  metadata:
    name: Cargo metadata smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust-setup
        with:
          toolchain: stable
      - run: mkdir -p target && cargo metadata --locked --format-version 1 > target/cargo-metadata.json
      - uses: actions/upload-artifact@v7
        with:
          name: cargo-metadata
          path: target/cargo-metadata.json
          retention-days: 7
