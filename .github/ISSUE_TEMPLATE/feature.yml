name: Feature Request
description: Propose a bounded Andromeda feature.
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: textarea
    id: intent
    attributes:
      label: Intent
      description: What problem does this solve?
    validations:
      required: true
  - type: textarea
    id: invariants
    attributes:
      label: Invariants
      description: Explain how this preserves determinism, typing, recovery, security, and observability.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
    validations:
      required: true
