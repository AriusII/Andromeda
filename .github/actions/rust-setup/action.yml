name: "Andromeda Rust Setup"
description: "Install Rust toolchain, components, targets, and Cargo cache for Andromeda workflows."
inputs:
  toolchain:
    description: "Rust toolchain"
    required: false
    default: "stable"
  components:
    description: "Comma-separated Rust components"
    required: false
    default: ""
  targets:
    description: "Comma-separated Rust targets"
    required: false
    default: ""
runs:
  using: "composite"
  steps:
    - uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: ${{ inputs.toolchain }}
        components: ${{ inputs.components }}
        targets: ${{ inputs.targets }}
    - uses: Swatinem/rust-cache@v2
      with:
        cache-on-failure: true
        shared-key: andromeda-rust-${{ inputs.toolchain }}
