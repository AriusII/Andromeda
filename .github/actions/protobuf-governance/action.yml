name: "Andromeda Protobuf Governance"
description: "Validate Protobuf contracts for QUIC-only Andromeda RPC. gRPC is forbidden."
runs:
  using: "composite"
  steps:
    - uses: bufbuild/buf-setup-action@v1
    - shell: bash
      run: python .github/scripts/no_grpc_policy.py
    - shell: bash
      run: |
        if [ -f buf.yaml ] || [ -f buf.work.yaml ]; then
          buf lint
        else
          echo "No buf.yaml or buf.work.yaml found. Skipping buf lint."
        fi
    - shell: bash
      run: |
        if [ -f buf.yaml ] || [ -f buf.work.yaml ]; then
          if git rev-parse --verify origin/main >/dev/null 2>&1; then
            buf breaking --against '.git#branch=main' || true
          else
            echo "origin/main not available. Skipping breaking check."
          fi
        fi
