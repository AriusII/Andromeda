name: "Andromeda Security Summary"
description: "Emit a normalized security summary for CI logs."
runs:
  using: "composite"
  steps:
    - shell: bash
      run: |
        echo "Andromeda security gate summary"
        echo "- No application-facing ad hoc SQL."
        echo "- QUIC transport only."
        echo "- Protobuf contracts allowed; gRPC forbidden."
        echo "- WAL-before-visible-commit remains a non-negotiable invariant."
        echo "- Unsafe Rust must be encapsulated, documented, tested, and audited."
