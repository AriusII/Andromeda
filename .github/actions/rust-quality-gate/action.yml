name: "Andromeda Rust Quality Gate"
description: "Run deterministic Rust quality checks for the Andromeda workspace."
runs:
  using: "composite"
  steps:
    - shell: bash
      run: cargo metadata --locked --format-version 1 > /tmp/cargo-metadata.json
    - shell: bash
      run: cargo fmt --all -- --check
    - shell: bash
      run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
    - shell: bash
      run: cargo build --workspace --all-features --locked
    - shell: bash
      run: cargo test --workspace --all-features --locked
