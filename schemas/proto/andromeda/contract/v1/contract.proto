syntax = "proto3";

package andromeda.contract.v1;

// Governed contract schema for Andromeda V0 procedure manifests and payload
// layouts. This package is message-only and must not define services or rpc
// methods.

message ProtocolLayout {
  bytes descriptor_set_hash = 1; // 32 bytes, nonzero.
  bytes frame_envelope_hash = 2; // 32 bytes, nonzero.
  string protocol_package = 3;
  string contract_package = 4;

  reserved 5 to 31;
}

message ProcedureManifest {
  uint64 procedure_id = 1;
  string procedure_name = 2;
  bytes contract_hash = 3; // 32 bytes, nonzero.
  uint64 catalog_version = 4;
  ProtocolLayout protocol_layout = 5;
  repeated ResultStreamDescriptor result_streams = 6;

  reserved 7 to 31;
}

message ResultStreamDescriptor {
  enum Cardinality {
    CARDINALITY_UNSPECIFIED = 0;
    CARDINALITY_ZERO_OR_MORE = 1;
    CARDINALITY_ZERO_OR_ONE = 2;
    CARDINALITY_ONE_OR_MORE = 3;
    CARDINALITY_EXACTLY_ONE = 4;
  }

  enum RowCountRequirement {
    ROW_COUNT_REQUIREMENT_UNSPECIFIED = 0;
    ROW_COUNT_REQUIREMENT_UNKNOWN_ALLOWED = 1;
    ROW_COUNT_REQUIREMENT_EXACT_IF_KNOWN = 2;
    ROW_COUNT_REQUIREMENT_EXACT_REQUIRED = 3;
  }

  string stream_name = 1;
  repeated ColumnDescriptor columns = 2;
  Cardinality cardinality = 3;
  RowCountRequirement row_count_requirement = 4;
  optional uint64 row_count_exact = 5;

  reserved 6 to 31;
}

message ColumnDescriptor {
  string name = 1;
  uint32 ordinal = 2;
  string type_name = 3;

  reserved 4 to 15;
}

message StructuredObjectHeader {
  enum Layout {
    LAYOUT_UNSPECIFIED = 0;
    LAYOUT_ROW_MAJOR = 1;
    LAYOUT_COLUMN_MAJOR = 2;
    LAYOUT_HYBRID = 3;
  }

  string name = 1;
  bytes contract_hash = 2; // 32 bytes.
  bytes shape_hash = 3; // 32 bytes, nonzero.
  uint64 row_count_exact = 4;
  uint32 column_count = 5;
  Layout layout = 6;
  uint64 payload_length = 7;
  optional uint64 payload_checksum = 8;
  optional uint64 max_payload_length = 9;

  reserved 10 to 31;
}
