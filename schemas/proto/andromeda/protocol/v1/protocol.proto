syntax = "proto3";

package andromeda.protocol.v1;

import "andromeda/contract/v1/contract.proto";

// Governed wire schema for Andromeda V0 reliable QUIC streams.
//
// This package is intentionally message-only. Andromeda does not generate
// gRPC, tonic, service, or rpc bindings from these schemas. QUIC DATAGRAM is
// reserved for telemetry-only soft signals and must not carry contract-bound
// RPC payloads.

enum PayloadKind {
  PAYLOAD_KIND_UNSPECIFIED = 0;

  PAYLOAD_KIND_HELLO = 1;
  PAYLOAD_KIND_AUTH = 2;
  PAYLOAD_KIND_CONTRACT_REQUEST = 3;
  PAYLOAD_KIND_CONTRACT_RESPONSE = 4;
  PAYLOAD_KIND_RPC_EXECUTE_REQUEST = 5;
  PAYLOAD_KIND_RPC_METADATA = 6;
  PAYLOAD_KIND_RPC_BATCH = 7;
  PAYLOAD_KIND_RPC_COMPLETION = 8;
  PAYLOAD_KIND_ERROR = 9;

  reserved 10 to 99;
  reserved 100 to 199; // QUIC telemetry frame-code range, not payload kind.
}

message ProtocolVersion {
  uint32 major = 1;
  uint32 minor = 2;

  reserved 3 to 15;
}

message FrameEnvelope {
  ProtocolVersion protocol_version = 1;
  bytes contract_hash = 2; // Required for contract-bound RPC payload kinds.
  uint64 catalog_version = 3;
  uint64 request_id = 4;
  uint64 session_id = 5;
  optional uint64 tx_id = 6;
  PayloadKind payload_kind = 7;
  bytes payload = 8; // Binary StructuredObject/protocol payload.

  reserved 9 to 31;
}

message RpcExecuteRequest {
  message Argument {
    string name = 1;
    string type_name = 2;
    bytes value = 3; // Binary StructuredObject scalar encoding, never JSON.

    reserved 4 to 15;
  }

  message RequestBudget {
    optional uint64 cpu_micros = 1;
    optional uint64 memory_bytes = 2;
    optional uint64 io_bytes = 3;
    optional uint32 priority_class = 4;

    reserved 5 to 15;
  }

  string procedure_name = 1;
  bytes expected_contract_hash = 2; // 32 bytes, nonzero for contract-bound calls.
  uint64 expected_catalog_version = 3;
  string surface_scope = 4;
  repeated Argument arguments = 5;
  RequestBudget budget = 6;

  reserved 7 to 31;
}

message RpcMetadata {
  repeated andromeda.contract.v1.ResultStreamDescriptor result_streams = 1;
  ResultCompletionPolicy completion_policy = 2;

  reserved 3 to 31;
}

message RpcBatch {
  string result_name = 1;
  uint64 batch_index = 2;
  uint64 rows_emitted = 3;
  bytes structured_payload = 4; // Binary StructuredObject row batch.
  optional uint64 row_count_exact = 5;
  bool terminal_batch = 6;

  reserved 7 to 31;
}

message ResultCompletionPolicy {
  enum CompletionShape {
    COMPLETION_SHAPE_UNSPECIFIED = 0;
    COMPLETION_SHAPE_REQUIRES_ROW_BATCH = 1;
    COMPLETION_SHAPE_ALLOWS_ZERO_ROW_COMPLETION = 2;
    COMPLETION_SHAPE_MUTATION_ONLY = 3;
  }

  CompletionShape completion_shape = 1;
  string reason = 2;

  reserved 3 to 15;
}

message RpcCompletion {
  enum Status {
    STATUS_UNSPECIFIED = 0;
    STATUS_COMMITTED = 1;
    STATUS_ROLLED_BACK = 2;
    STATUS_FAILED_BEFORE_TRANSACTION = 3;
    STATUS_CANCELLED = 4;
    STATUS_POISONED = 5;
    STATUS_PERMISSION_DENIED = 6;
    STATUS_CONTRACT_REJECTED = 7;
    STATUS_SYSTEM_UNAVAILABLE = 8;
  }

  enum TransactionOutcome {
    TRANSACTION_OUTCOME_UNSPECIFIED = 0;
    TRANSACTION_OUTCOME_NOT_STARTED = 1;
    TRANSACTION_OUTCOME_COMMITTED = 2;
    TRANSACTION_OUTCOME_ROLLED_BACK = 3;
    TRANSACTION_OUTCOME_FAILED = 4;
    TRANSACTION_OUTCOME_CANCELLED = 5;
  }

  message ResultRowCountSummary {
    string result_name = 1;
    uint64 rows_emitted = 2;
    optional uint64 row_count_exact = 3;

    reserved 4 to 15;
  }

  Status status = 1;
  optional uint64 rows_affected = 2;
  optional uint64 tx_id = 3;
  optional uint64 request_id = 32;
  optional uint64 session_id = 33;
  optional string trace_id = 34;
  TransactionOutcome transaction_outcome = 35;
  // Required and nonzero when status is COMMITTED or ROLLED_BACK; absent for
  // pre-transaction rejections where transaction_outcome is NOT_STARTED.
  optional uint64 durable_lsn = 36;
  repeated ResultRowCountSummary result_row_counts = 37;

  reserved 4 to 31;
  reserved 38 to 63;
}

message ErrorEnvelope {
  enum ErrorFamily {
    ERROR_FAMILY_UNSPECIFIED = 0;
    ERROR_FAMILY_PROTOCOL = 1;
    ERROR_FAMILY_AUTHENTICATION = 2;
    ERROR_FAMILY_AUTHORIZATION = 3;
    ERROR_FAMILY_CONTRACT = 4;
    ERROR_FAMILY_SEMANTIC = 5;
    ERROR_FAMILY_EXECUTION = 6;
    ERROR_FAMILY_TRANSACTION = 7;
    ERROR_FAMILY_STORAGE = 8;
    ERROR_FAMILY_RESOURCE = 9;
  }

  enum TransactionEffect {
    TRANSACTION_EFFECT_UNSPECIFIED = 0;
    TRANSACTION_EFFECT_NO_TRANSACTION = 1;
    TRANSACTION_EFFECT_ROLLBACK_REQUIRED = 2;
    TRANSACTION_EFFECT_FAIL_STOP = 3;
  }

  enum RetryDisposition {
    RETRY_DISPOSITION_UNSPECIFIED = 0;
    RETRY_DISPOSITION_NOT_RETRYABLE = 1;
    RETRY_DISPOSITION_RETRYABLE = 2;
    RETRY_DISPOSITION_RETRY_AFTER = 3;
    RETRY_DISPOSITION_BACKPRESSURE = 4;
  }

  message BackpressureMetadata {
    optional uint64 retry_after_ms = 1;
    optional uint32 capacity_percent = 2; // 0..100 when present.
    bool shed_load = 3;

    reserved 4 to 15;
  }

  optional uint64 request_id = 1;
  optional uint64 session_id = 2;
  optional string trace_id = 3;
  ErrorFamily family = 4;
  string code = 5;
  string message = 6;
  TransactionEffect transaction_effect = 7;
  RetryDisposition retry_disposition = 8;
  optional uint64 retry_after_ms = 9;
  optional BackpressureMetadata backpressure = 10;

  reserved 11 to 31;
}
