[workspace]
resolver = "3"
members = [
    "crates/andromeda-bench",
    "crates/andromeda-cli",
    "crates/andromeda-catalog",
    "crates/andromeda-contract",
    "crates/andromeda-core",
    "crates/andromeda-digest",
    "crates/andromeda-error",
    "crates/andromeda-exec",
    "crates/andromeda-hardware",
    "crates/andromeda-observe",
    "crates/andromeda-proto",
    "crates/andromeda-quic",
    "crates/andromeda-rpc-protocol",
    "crates/andromeda-security-contract",
    "crates/andromeda-srpl",
    "crates/andromeda-srpl-ast",
    "crates/andromeda-srpl-cardinality",
    "crates/andromeda-srpl-diagnostics",
    "crates/andromeda-srpl-ir",
    "crates/andromeda-srpl-parser",
    "crates/andromeda-storage",
    "crates/andromeda-structured-object",
    "crates/andromeda-time",
    "crates/andromeda-tx",
    "crates/andromeda-types",
    "crates/andromeda-wal",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
andromeda-catalog = { path = "crates/andromeda-catalog", version = "0.1.0" }
andromeda-bench = { path = "crates/andromeda-bench", version = "0.1.0" }
andromeda-contract = { path = "crates/andromeda-contract", version = "0.1.0" }
andromeda-core = { path = "crates/andromeda-core", version = "0.1.0" }
andromeda-digest = { path = "crates/andromeda-digest", version = "0.1.0" }
andromeda-error = { path = "crates/andromeda-error", version = "0.1.0" }
andromeda-exec = { path = "crates/andromeda-exec", version = "0.1.0" }
andromeda-hardware = { path = "crates/andromeda-hardware", version = "0.1.0" }
andromeda-observe = { path = "crates/andromeda-observe", version = "0.1.0" }
andromeda-proto = { path = "crates/andromeda-proto", version = "0.1.0" }
andromeda-quic = { path = "crates/andromeda-quic", version = "0.1.0" }
andromeda-rpc-protocol = { path = "crates/andromeda-rpc-protocol", version = "0.1.0" }
andromeda-security-contract = { path = "crates/andromeda-security-contract", version = "0.1.0" }
andromeda-srpl = { path = "crates/andromeda-srpl", version = "0.1.0" }
andromeda-srpl-ast = { path = "crates/andromeda-srpl-ast", version = "0.1.0" }
andromeda-srpl-cardinality = { path = "crates/andromeda-srpl-cardinality", version = "0.1.0" }
andromeda-srpl-diagnostics = { path = "crates/andromeda-srpl-diagnostics", version = "0.1.0" }
andromeda-srpl-ir = { path = "crates/andromeda-srpl-ir", version = "0.1.0" }
andromeda-srpl-parser = { path = "crates/andromeda-srpl-parser", version = "0.1.0" }
andromeda-storage = { path = "crates/andromeda-storage", version = "0.1.0" }
andromeda-structured-object = { path = "crates/andromeda-structured-object", version = "0.1.0" }
andromeda-time = { path = "crates/andromeda-time", version = "0.1.0" }
andromeda-tx = { path = "crates/andromeda-tx", version = "0.1.0" }
andromeda-types = { path = "crates/andromeda-types", version = "0.1.0" }
andromeda-wal = { path = "crates/andromeda-wal", version = "0.1.0" }

quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rcgen = { version = "0.14.7" }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio = { version = "1", default-features = false, features = ["net", "rt", "time"] }

# Fuzz and property testing
proptest = "1.4"

[profile.fuzz]
inherits = "release"
lto = true
strip = false
debug = true
# For libfuzzer: libFuzzer itself forces certain settings
