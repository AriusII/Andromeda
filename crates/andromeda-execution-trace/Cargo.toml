[package]
name = "andromeda-execution-trace"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
andromeda-audit.workspace = true
andromeda-error.workspace = true
andromeda-observability.workspace = true
andromeda-principal.workspace = true
andromeda-procedure-contract.workspace = true
andromeda-result-stream.workspace = true
andromeda-retry.workspace = true
andromeda-transaction.workspace = true
andromeda-types.workspace = true
andromeda-wal.workspace = true

[features]
# Enables `InMemoryAuditLedger` for use in integration tests and development
# tooling. This feature MUST NOT be enabled in production builds; doing so
# risks silently losing audit traces across restarts (Doctrine INV-012).
test-fixtures = []

[[test]]
name = "invocation_timeout_contract"
path = "tests/invocation_timeout_contract.rs"
required-features = ["test-fixtures"]

[[test]]
name = "invocation_trace_contract"
path = "tests/invocation_trace_contract.rs"
required-features = ["test-fixtures"]
