syntax = "proto3";

package andromeda.protocol.v1;

import "andromeda/protocol/v1/envelope.proto";
import "andromeda/protocol/v1/completion.proto";
import "andromeda/protocol/v1/error.proto";
import "andromeda/protocol/v1/invocation.proto";
import "andromeda/protocol/v1/payload.proto";

// Crate-local protocol schema assembly point.
//
// Durable transport envelope contracts live in envelope.proto. Procedure
// payload, result metadata, and row-batch contracts live in payload.proto.
// Typed error payload contracts live in error.proto. Invocation request/response
// containers live in invocation.proto. Completion policy and RPC completion
// contracts live in completion.proto. The split keeps envelope metadata ahead of
// opaque payload bytes while preserving the package and field numbers of the
// existing andromeda.protocol.v1 wire messages.
