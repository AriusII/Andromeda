[dependencies]
andromeda-admission.workspace = true
andromeda-audit.workspace = true
andromeda-catalog.workspace = true
andromeda-catalog-store.workspace = true
andromeda-definition-batch.workspace = true
andromeda-error.workspace = true
andromeda-execution.workspace = true
andromeda-execution-trace.workspace = true
andromeda-hardware.workspace = true
andromeda-iam.workspace = true
andromeda-observe.workspace = true
andromeda-observability.workspace = true
andromeda-plan-cache.workspace = true
andromeda-principal.workspace = true
andromeda-procedure-contract.workspace = true
andromeda-procedure-runtime.workspace = true
andromeda-procedure-store.workspace = true
andromeda-quic.workspace = true
andromeda-rpc-protocol.workspace = true
andromeda-result-stream.workspace = true
andromeda-retry.workspace = true
andromeda-security.workspace = true
andromeda-srpl-interpreter.workspace = true
