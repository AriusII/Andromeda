[package]
name = "andromeda-exec"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
andromeda-admission.workspace = true
andromeda-audit.workspace = true
andromeda-catalog.workspace = true
andromeda-core.workspace = true
andromeda-execution-trace.workspace = true
andromeda-iam.workspace = true
andromeda-observe.workspace = true
andromeda-procedure-runtime.workspace = true
andromeda-proto.workspace = true
andromeda-quic.workspace = true
andromeda-result-stream.workspace = true
andromeda-retry.workspace = true
andromeda-security.workspace = true
andromeda-srpl.workspace = true
andromeda-srpl-execution-adapter.workspace = true
andromeda-srpl-interpreter.workspace = true
andromeda-srpl-ir.workspace = true
andromeda-storage.workspace = true
andromeda-tx.workspace = true
tokio.workspace = true

[features]
default = []
runtime-quinn = ["andromeda-quic/runtime-quinn"]

[dev-dependencies]
andromeda-business-fixtures.workspace = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(andromeda_remote_network_e2e)', 'cfg(feature, values("runtime-quinn"))'] }

[[test]]
name = "remote_invoke_network_e2e"
path = "tests/remote_invoke_network_e2e.rs"
required-features = ["runtime-quinn"]

[[test]]
name = "c4_admission_events"
path = "tests/c4_admission_events.rs"

[[test]]
name = "c5_commit_rollback_lifecycle"
path = "tests/c5_commit_rollback_lifecycle.rs"

[[test]]
name = "c6_recovery_security_audit"
path = "tests/c6_recovery_security_audit.rs"

[[test]]
name = "core_io_gates"
path = "tests/core_io_gates.rs"

[[test]]
name = "executor_validation_gates"
path = "tests/executor_validation_gates.rs"

[[test]]
name = "runtime_contract"
path = "tests/runtime_contract.rs"

[[test]]
name = "v0_vertical_e2e"
path = "tests/v0_vertical_e2e.rs"
