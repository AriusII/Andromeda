andromeda-recovery.workspace = true
andromeda-srpl-binder.workspace = true
andromeda-srpl-definition-batch.workspace = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(andromeda_remote_network_e2e)', 'cfg(feature, values("runtime-quinn", "test-fixtures"))'] }

